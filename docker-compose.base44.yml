services:
  app:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - CLOUDFLARE_TELEMETRY_DISABLED=1
    # Install wrangler, apply D1 migrations to the local SQLite, then start the
    # live-reload dev server on port 3000 bound to all interfaces.
    command: >
      sh -c "npm install -g wrangler@latest &&
             wrangler d1 migrations apply cip-strike-cockpit-db --local &&
             wrangler dev --port 3000 --ip 0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
